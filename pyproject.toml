[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgx"
version = "0.1.0"
description = "A malware configuration extraction framework"
requires-python = ">=3.12"
dependencies = [
    "yara-python>=4.5.0",
    "pefile>=2024.8.26",
    "pyelftools>=0.32",
    "pycryptodome>=3.20.0",
]

[project.scripts]
cfgx = "cfgx.cli:main"

[tool.setuptools.packages.find]
include = [
    "cfgx*",
    "formats*",
    "yara_handler*",
]